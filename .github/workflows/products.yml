name: Daily official product update
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-catalog.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: npm run update:products
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-catalog-report
          path: |
            work/catalog-check.json
            work/mof-report.json
      - run: npm test
      - run: npm run build
      - name: Commit verified changes only
        run: |
          if ! git diff --quiet -- public/data; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data
            git commit -m 'data: update verified official tobacco catalog'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy updated public catalog
        id: deployment
        uses: actions/deploy-pages@v4
